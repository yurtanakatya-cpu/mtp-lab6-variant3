{% extends "base.html" %}
{% block title %}Кабинет · Лабораторная №6{% endblock %}

{% block content %}
<section class="auth-panel card mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="page-title h2">Личный кабинет</h1>
        <p class="mb-4">Вы вошли как <strong>{{ username }}</strong>.</p>
        <form method="post" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-outline-secondary" type="submit">Выйти</button>
        </form>
    </div>
</section>
{% endblock %}
