<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}МТП · Лабораторная №6{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body class="lab-page">
    <header class="site-header">
        <nav class="container d-flex flex-wrap align-items-center
                    justify-content-between py-3 gap-2" aria-label="Навигация">
            <a class="brand" href="{{ url_for('index') }}">МТП · Лабораторная №6</a>
            <div class="nav align-items-center">
                <a class="nav-link" href="{{ url_for('about') }}">О проекте</a>
                {% if signed_in() %}
                <a class="nav-link" href="{{ url_for('auth.account') }}">Кабинет</a>
                {% else %}
                <a class="nav-link" href="{{ url_for('auth.login') }}">Вход</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
