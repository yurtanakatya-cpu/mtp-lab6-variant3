{% extends "base.html" %}
{% block title %}Вход · Лабораторная №6{% endblock %}

{% block content %}
<section class="auth-panel card mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="page-title h2 mb-3">Вход</h1>
        {% if unavailable %}
        <p class="alert alert-info mb-0">Учётная запись ещё не настроена.</p>
        {% else %}
        {% if error %}
        <p class="alert alert-danger" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="username">Имя пользователя</label>
                <input class="form-control" id="username" name="username"
                       maxlength="64" autocomplete="username" required>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-control" id="password" name="password"
                       type="password" maxlength="128"
                       autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary" type="submit">Войти</button>
        </form>
        {% endif %}
    </div>
</section>
{% endblock %}
